name: Samsung backend refresh

# Daily: check upstream KernelSU-Next and BakaSU. For each backend that moved,
# mirror upstream into upstream-<backend>, rebuild the Galaxy S26 Ultra manager
# (+ ksud + .ko) with its own signing cert, and update that backend's rolling
# release. If nothing moved, only the "last successful run" timestamp in each
# release is refreshed. If only one moved, only that one's release is touched.

on:
  schedule:
    - cron: '36 4 * * *'   # 04:36 UTC daily (off-peak, jittered minute)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a rebuild regardless of upstream: "", "all", "kernelsu-next", or "bakasu"'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: samsung-refresh
  cancel-in-progress: false

jobs:
  # =========================================================================
  detect:
    runs-on: ubuntu-latest
    outputs:
      kernelsu_next_changed: ${{ steps.d.outputs.kernelsu_next_changed }}
      kernelsu_next_sha:     ${{ steps.d.outputs.kernelsu_next_sha }}
      bakasu_changed:        ${{ steps.d.outputs.bakasu_changed }}
      bakasu_sha:            ${{ steps.d.outputs.bakasu_sha }}
      any_changed:           ${{ steps.d.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect upstream changes
        id: d
        run: python3 tools/backend-refresh/detect_changes.py "force=${{ inputs.force }}"
      - name: Mirror changed upstreams into upstream-* branches
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -uo pipefail
          # Best-effort mirror. The automatic GITHUB_TOKEN is forbidden from
          # pushing commits that touch .github/workflows/** (GitHub's "workflows
          # permission" rule), and upstream trees carry their own CI, so a plain
          # mirror push is rejected. We therefore push a mirror with upstream's
          # workflow files stripped; if even that is blocked we warn and carry on
          # (the build/release path does not depend on these branches, and the
          # exact upstream commit is recorded in state + release notes anyway).
          # Set repo secret MIRROR_TOKEN (a PAT with `workflow` scope) to mirror
          # upstream verbatim instead.
          mirror() { # repo branch our_branch sha changed
            [ "$5" = "true" ] || { echo "skip mirror $3 (unchanged)"; return 0; }
            echo "== mirroring $1@$2 -> $3 =="
            rm -rf up && git clone --single-branch --branch "$2" "https://github.com/$1" up
            local push_url
            if [ -n "${MIRROR_TOKEN:-}" ]; then
              push_url="https://x-access-token:${MIRROR_TOKEN}@github.com/${{ github.repository }}"
              git -C up push -f "$push_url" "$4:refs/heads/$3" && { echo "mirrored verbatim"; return 0; }
              echo "::warning::verbatim mirror push failed for $3"
            fi
            # Fallback: orphan single-commit snapshot of the upstream tree with
            # .github/workflows removed (a new branch's whole history counts as
            # "added", so workflow files must be absent from every commit, not
            # just the tip). Token-pushable and still a faithful source snapshot.
            push_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
            git -C up checkout -q "$4"
            rm -rf up/.github/workflows
            git -C up checkout -q --orphan _mirror
            git -C up add -A
            git -C up -c user.name=bot -c user.email=bot@users.noreply.github.com \
              commit -q -m "snapshot mirror of $1@$4 (CI workflows omitted — GITHUB_TOKEN cannot push workflow files; set MIRROR_TOKEN for a verbatim mirror)"
            git -C up push -f "$push_url" "_mirror:refs/heads/$3" \
              || echo "::warning::mirror of $3 skipped (push blocked); upstream commit still recorded in state"
          }
          mirror KernelSU-Next/KernelSU-Next dev  upstream-kernelsu-next \
            "${{ steps.d.outputs.kernelsu_next_sha }}" "${{ steps.d.outputs.kernelsu_next_changed }}" \
            || echo "::warning::kernelsu-next mirror step errored; continuing"
          mirror Baka-SU/BakaSU main  upstream-bakasu \
            "${{ steps.d.outputs.bakasu_sha }}" "${{ steps.d.outputs.bakasu_changed }}" \
            || echo "::warning::bakasu mirror step errored; continuing"
          echo "mirror step done"

  # =========================================================================
  build-kernelsu-next:
    needs: detect
    if: needs.detect.outputs.kernelsu_next_changed == 'true'
    uses: ./.github/workflows/build-kernelsu-next.yml
    with:
      upstream_sha: ${{ needs.detect.outputs.kernelsu_next_sha }}

  build-bakasu:
    needs: detect
    if: needs.detect.outputs.bakasu_changed == 'true'
    uses: ./.github/workflows/build-bakasu.yml
    with:
      upstream_sha: ${{ needs.detect.outputs.bakasu_sha }}

  # =========================================================================
  release-kernelsu-next:
    needs: [detect, build-kernelsu-next]
    if: needs.detect.outputs.kernelsu_next_changed == 'true' && needs.build-kernelsu-next.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: kernelsu-next-samsung
      TITLE: KernelSU Next (Samsung)
      STATE: state/kernelsu-next.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { pattern: ksun-*, path: dl }
      - name: Collect release assets
        run: |
          tools/backend-refresh/collect_assets.sh ksun dl release-assets | tee assets.txt
      - name: Update state + render notes
        run: |
          python3 tools/backend-refresh/update_state.py --state "$STATE" --mode rebuild \
            --field last_built_sha=${{ needs.detect.outputs.kernelsu_next_sha }} \
            --field last_built_short=${{ needs.build-kernelsu-next.outputs.upstream_short }} \
            --field driver_version=${{ needs.build-kernelsu-next.outputs.driver_version }} \
            --field uapi_version=${{ needs.build-kernelsu-next.outputs.uapi_version }} \
            --field version_name=${{ needs.build-kernelsu-next.outputs.version_name }} \
            --field manager_version_code=${{ needs.build-kernelsu-next.outputs.driver_version }} \
            --field cert_size_hex=${{ needs.build-kernelsu-next.outputs.cert_size_hex }} \
            --field cert_hash=${{ needs.build-kernelsu-next.outputs.cert_hash }} \
            --assets-file assets.txt
          python3 tools/backend-refresh/render_release_notes.py "$STATE" > notes.md
      - name: Publish rolling release
        run: tools/backend-refresh/publish_release.sh "$TAG" "$TITLE" release-assets notes.md
      - uses: actions/upload-artifact@v7
        with: { name: state-kernelsu-next, path: state/kernelsu-next.json }

  release-bakasu:
    needs: [detect, build-bakasu]
    if: needs.detect.outputs.bakasu_changed == 'true' && needs.build-bakasu.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: bakasu-samsung
      TITLE: BakaSU (Samsung)
      STATE: state/bakasu.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with: { pattern: baka-*, path: dl }
      - name: Collect release assets
        run: |
          tools/backend-refresh/collect_assets.sh baka dl release-assets | tee assets.txt
      - name: Update state + render notes
        run: |
          python3 tools/backend-refresh/update_state.py --state "$STATE" --mode rebuild \
            --field last_built_sha=${{ needs.detect.outputs.bakasu_sha }} \
            --field last_built_short=${{ needs.build-bakasu.outputs.upstream_short }} \
            --field driver_version=${{ needs.build-bakasu.outputs.driver_version }} \
            --field uapi_version=${{ needs.build-bakasu.outputs.uapi_version }} \
            --field version_name=${{ needs.build-bakasu.outputs.version_name }} \
            --field manager_version_code=${{ needs.build-bakasu.outputs.driver_version }} \
            --field cert_size_hex=${{ needs.build-bakasu.outputs.cert_size_hex }} \
            --field cert_hash=${{ needs.build-bakasu.outputs.cert_hash }} \
            --assets-file assets.txt
          python3 tools/backend-refresh/render_release_notes.py "$STATE" > notes.md
      - name: Publish rolling release
        run: tools/backend-refresh/publish_release.sh "$TAG" "$TITLE" release-assets notes.md
      - uses: actions/upload-artifact@v7
        with: { name: state-bakasu, path: state/bakasu.json }

  # =========================================================================
  heartbeat:
    needs: detect
    if: needs.detect.outputs.any_changed == 'false'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Refresh "last successful run" timestamp in both releases
        run: |
          beat() { # tag state
            python3 tools/backend-refresh/update_state.py --state "$2" --mode heartbeat
            python3 tools/backend-refresh/render_release_notes.py "$2" > notes.md
            if gh release view "$1" >/dev/null 2>&1; then
              gh release edit "$1" --notes-file notes.md
              echo "heartbeat: updated notes for $1"
            else
              echo "heartbeat: release $1 does not exist yet; nothing to update"
            fi
          }
          beat kernelsu-next-samsung state/kernelsu-next.json
          beat bakasu-samsung        state/bakasu.json
      - uses: actions/upload-artifact@v7
        with: { name: state-kernelsu-next, path: state/kernelsu-next.json }
      - uses: actions/upload-artifact@v7
        with: { name: state-bakasu, path: state/bakasu.json }

  # =========================================================================
  persist-state:
    needs: [detect, release-kernelsu-next, release-bakasu, heartbeat]
    if: always() && needs.detect.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with: { pattern: state-*, path: incoming, merge-multiple: true }
      - name: Commit updated state (if any)
        run: |
          set -e
          [ -d incoming ] || { echo "no state artifacts"; exit 0; }
          cp -f incoming/*.json state/ 2>/dev/null || true
          if git diff --quiet -- state; then
            echo "no state changes to commit"
            exit 0
          fi
          git config user.name  "samsung-root-managers-bot"
          git config user.email "69053671+thecaticorn01@users.noreply.github.com"
          git add state
          git commit -m "chore(state): update rolling-release provenance [skip ci]"
          git push
